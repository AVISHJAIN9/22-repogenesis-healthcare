services:
  - type: web
    name: aj-repogenesis-healthcare
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: VITALS
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PORT
        value: 10000
